name: Go Module Release

on:
  push:
    tags:
      - 'go/v*'

jobs:
  release:
    name: Create Go Module Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/go/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Verify Go module
        run: |
          cd go
          go mod verify
          go mod tidy
          go build ./...

      - name: Run Go tests
        run: |
          cd go
          go test ./... -v

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Go Module Release ${{ steps.get_version.outputs.version }}
          body: |
            Go module release version ${{ steps.get_version.outputs.version }}
            
            ## Installation
            ```bash
            go get github.com/cncf/xds/go@${{ github.ref_name }}
            ```
            
            ## Import
            ```go
            import "github.com/cncf/xds/go/..."
            ```
          generate_release_notes: true
