name: Go Module Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Verify and Test Go Module
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify Go module
        working-directory: go
        run: |
          go mod verify
          go mod tidy
          go build ./...

      - name: Run Go tests
        working-directory: go
        run: go test ./... -v

