name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          body: |
            # xDS Release ${{ github.ref_name }}
            
            This release includes updates for all language bindings:
            
            ## Python (PyPI)
            ```bash
            pip install xds==${{ github.ref_name }}
            ```
            
            ## Go Module
            ```bash
            go get github.com/cncf/xds/go@${{ github.ref_name }}
            ```
            
            ## Bazel (BCR)
            ```starlark
            bazel_dep(name = "xds", version = "${{ github.ref_name }}")
            ```
            
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          generate_release_notes: true

