name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          body: |
            # xDS Release ${{ steps.get_version.outputs.version }}
            
            This release includes updates for all language bindings:
            
            ## Python (PyPI)
            ```bash
            pip install xds==${{ steps.get_version.outputs.version }}
            ```
            
            ## Go Module
            ```bash
            go get github.com/cncf/xds/go@${{ github.ref_name }}
            ```
            
            ## Bazel (BCR)
            ```starlark
            bazel_dep(name = "xds", version = "${{ steps.get_version.outputs.version }}")
            ```
            
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          generate_release_notes: true
